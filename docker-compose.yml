# ScholarAgent — Docker Compose
# Single-command deployment: docker compose up -d
# Requires .env file with LLM_API_KEY set

services:
  scholaragent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scholaragent
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount session/persistent data for durability across restarts
      - scholaragent_memory:/app/memory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  scholaragent_memory:
    # Docker-managed named volume for memory/session and memory/persistent